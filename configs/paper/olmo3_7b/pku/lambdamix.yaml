model_name_or_path: allenai/Olmo-3-1025-7B
attn_implementation: sdpa
trust_remote_code: true
dataset_name: pku_safety
dataset_train_split: train
dataset_test_split: ''
reward_funcs:
- pku_helpfulness
- pku_harmlessness
num_generations: 8
generation_batch_size: 8
max_completion_length: 1024
temperature: 0.6
top_p: 0.95
generation_kwargs:
  stop_token_ids:
  - 100265
  - 100257
  - 100264
max_steps: 500
per_device_train_batch_size: 1
gradient_accumulation_steps: 64
learning_rate: 1.0e-06
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
lr_scheduler_type: cosine
warmup_steps: 50
bf16: true
epsilon: 0.2
epsilon_high: 0.28
beta: 0.2
loss_type: dapo
use_vllm: false
use_transformers_paged: false
seed: 42
data_seed: 42
logging_steps: 5
save_strategy: steps
save_steps: 25
save_total_limit: 1
report_to: none
run_name: olmo3_7b_pku_lambdamix
output_dir: outputs/olmo3_7b/pku/lambdamix
num_objectives: 2
pareto_r: 8
pareto_alpha: 128
pareto_target_modules:
- q_proj
- v_proj
pareto_adapter_dtype: bf16
pareto_dropout: 0.0
num_preference_samples: 4
annealing_temperature: 0.3
preference_sampling: coverage
adapter_preference_conditioning: requested
advantage_preference_conditioning: requested
multi_objective_aggregation: normalize_then_sum
pareto_a_init: rank_scaled
mask_truncated_completions: false
weight_decay: 0.0
optim: adamw_torch
