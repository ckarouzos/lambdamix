model_name_or_path: allenai/Olmo-3-1025-7B
attn_implementation: sdpa
trust_remote_code: false
dataset_name: pku_preference_vector
dataset_train_split: train
dataset_test_split: test
preference_direction: helpful+
max_train_samples: null
max_eval_samples: 512
num_train_epochs: 2
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-06
lr_scheduler_type: cosine
pv_warmup_ratio: 0.03
weight_decay: 0.0
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
bf16: true
beta: 0.1
loss_type: sigmoid
max_length: 512
eval_strategy: epoch
logging_steps: 25
save_strategy: steps
save_steps: 500
save_total_limit: 2
report_to: none
seed: 42
data_seed: 42
run_name: olmo3_7b_pku_preference_vector_helpful_plus
output_dir: outputs/olmo3_7b/pku/preference_vector_helpful_plus
use_peft: true
lora_r: 8
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules:
- q_proj
- v_proj
optim: adamw_torch
